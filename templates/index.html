<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Followers Network Analyzer</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #121214;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --border-color: #1f1f23;
            --border-radius: 12px;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: var(--border-radius);
        }

        h1 {
            font-size: 2.2rem;
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 35px;
            font-weight: 400;
        }

        .form-group {
            margin: 25px 0;
            display: flex;
            justify-content: center;
        }

        form {
            display: flex;
            gap: 14px;
            width: 100%;
            justify-content: center;
        }

        input[type="text"] {
            padding: 14px 20px;
            width: 350px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background-color: #0f0f11;
            color: #ffffff;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.2);
        }

        input[type="text"]::placeholder {
            color: #4b5563;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            background-color: var(--primary);
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .message-alert {
            background-color: #1e1b4b;
            color: #a5b4fc;
            padding: 14px 24px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 30px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid #312e81;
            text-align: left;
        }

        #graph-wrapper {
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            overflow: hidden;
            background-color: #121214;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>GitHub Followers Network Analyzer</h1>
        <div class="subtitle">Analyze relationships and visualize open-source developer connections.</div>
        
        <div class="form-group">
            <form method="POST" action="/">
                <input type="text" name="username" placeholder="Enter GitHub username" required>
                <button type="submit">Analyze Network</button>
            </form>
        </div>

        {% if message %}
        <div class="message-alert">
            {{ message }}
        </div>
        {% endif %}

        <div id="graph-wrapper">
            {{ graph_html }}
        </div>
    </div>
</body>
</html>
